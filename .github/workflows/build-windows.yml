name: Build Windows VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CXXFLAGS: /DNOMINMAX
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFXTEND_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target FXtend_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: FXtend-VST3-Windows
          path: build/FXtend_artefacts/Release/VST3/
